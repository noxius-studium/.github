<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="1000" height="390" role="img" aria-labelledby="title desc">
<title id="title">Noxius Studium — built to be used, open to be understood</title>
<desc id="desc">A signal branches into FluidMusic, Enchanted Composer, EventFlowSys and protocol studies.</desc>
<style>.flow{stroke-dasharray:12 16;animation:flow 5s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.wave{transform-box:fill-box;transform-origin:center;animation:wave 1.8s ease-in-out infinite alternate}.wave:nth-child(3n){animation-delay:-.6s}.wave:nth-child(3n + 1){animation-delay:-1.2s}@keyframes flow{to{stroke-dashoffset:-140}}@keyframes pulse{50%{opacity:.4}}@keyframes wave{to{transform:scaleY(.35)}}@media(prefers-reduced-motion:reduce){.flow,.pulse,.wave{animation:none}}</style>
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
<path d="M32 0H0V32" fill="none" stroke="#26333b" stroke-opacity=".35"/>
</pattern>
</defs>
<rect width="1000" height="390" rx="12" fill="#0b1218"/>
<rect x="1" y="1" width="998" height="388" rx="12" fill="url(#grid)" stroke="#2c3b43"/>
<text x="38" y="40" font-family="Consolas,monospace" font-size="14" font-weight="400" fill="#3ad6c6" letter-spacing="1.2">NOXIUS STUDIUM / ENGINEERING FIELD NOTES</text>
<text x="960" y="40" font-family="Consolas,monospace" font-size="14" font-weight="400" fill="#ffb347" letter-spacing="1.2">ZA</text>
<text x="38" y="131" font-family="Arial,Helvetica,sans-serif" font-size="76" font-weight="800" fill="#f4f0e6" letter-spacing="-3">NOXIUS</text>
<text x="40" y="203" font-family="Georgia,serif" font-size="72" font-weight="400" fill="#f4f0e6" font-style="italic">studium</text>
<text x="42" y="252" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="600" fill="#f4f0e6" >Built to be used.</text>
<text x="42" y="285" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#aab8be" >Open to be understood.</text>
<text x="42" y="357" font-family="Consolas,monospace" font-size="15" font-weight="400" fill="#3ad6c6" letter-spacing="1.2">BUILD / VERIFY / SHARE</text>
<path d="M535 84V294M535 104H577M535 164H577M535 224H577M535 284H577" fill="none" stroke="#3ad6c6" stroke-width="2" class="flow"/>
<circle cx="535" cy="104" r="5" fill="#ffb347"/>
<text x="590" y="99" font-family="Consolas,monospace" font-size="14" font-weight="400" fill="#ffb347" letter-spacing="1.2">01</text>
<text x="630" y="99" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600" fill="#f4f0e6" >FluidMusic</text>
<text x="630" y="123" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#aab8be" >Music, with honest provider boundaries.</text>
<circle cx="535" cy="164" r="5" fill="#ffb347"/>
<text x="590" y="159" font-family="Consolas,monospace" font-size="14" font-weight="400" fill="#ffb347" letter-spacing="1.2">02</text>
<text x="630" y="159" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600" fill="#f4f0e6" >Enchanted Composer</text>
<text x="630" y="183" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#aab8be" >Drafts, prompts, and owner-bound voice.</text>
<circle cx="535" cy="224" r="5" fill="#ffb347"/>
<text x="590" y="219" font-family="Consolas,monospace" font-size="14" font-weight="400" fill="#ffb347" letter-spacing="1.2">03</text>
<text x="630" y="219" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600" fill="#f4f0e6" >EventFlowSys</text>
<text x="630" y="243" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#aab8be" >Messages you can follow.</text>
<circle cx="535" cy="284" r="5" fill="#ffb347"/>
<text x="590" y="279" font-family="Consolas,monospace" font-size="14" font-weight="400" fill="#ffb347" letter-spacing="1.2">04</text>
<text x="630" y="279" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600" fill="#f4f0e6" >Protocol studies</text>
<text x="630" y="303" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#aab8be" >One domain. Different interfaces.</text>
<path d="M535 331H957" fill="none" stroke="#34434e" stroke-width="2" class=""/>
<text x="535" y="359" font-family="Consolas,monospace" font-size="15" font-weight="400" fill="#3ad6c6" letter-spacing="1.2">PUBLIC TOOLS. VISIBLE SEAMS.</text>
</svg>
