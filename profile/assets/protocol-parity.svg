<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="title desc">
  <title id="title">REST, GraphQL, and SOAP protocol comparison</title>
  <desc id="desc">Three API protocols expose the same user domain operations for direct comparison.</desc>
  <style>
    .rest{animation:rest 4.8s ease-in-out infinite}.gql{animation:gql 4.8s ease-in-out .8s infinite}.soap{animation:soap 4.8s ease-in-out 1.6s infinite}.core{animation:core 2.4s ease-in-out infinite}
    @keyframes rest{0%,10%{transform:translate(0,0);opacity:0}35%,65%{transform:translate(350px,57px);opacity:1}90%,100%{transform:translate(700px,0);opacity:0}}
    @keyframes gql{0%,10%{transform:translate(0,0);opacity:0}35%,65%{transform:translate(350px,0);opacity:1}90%,100%{transform:translate(700px,0);opacity:0}}
    @keyframes soap{0%,10%{transform:translate(0,0);opacity:0}35%,65%{transform:translate(350px,-57px);opacity:1}90%,100%{transform:translate(700px,0);opacity:0}}
    @keyframes core{0%,100%{stroke:#3ad6c6}50%{stroke:#ffb347}}
    @media(prefers-reduced-motion:reduce){.rest,.gql,.soap,.core{animation:none}}
  </style>
  <rect width="1200" height="300" rx="12" fill="#10171d"/>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" letter-spacing="1.6">
    <text x="42" y="43" fill="#ffb347" font-size="12">PROTOCOL PARITY / 03</text>
    <text x="1158" y="43" fill="#70808b" font-size="12" text-anchor="end">REST · GRAPHQL · SOAP</text>
  </g>
  <text x="42" y="85" fill="#f4f0e6" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">Change the protocol. Hold the problem still.</text>
  <g transform="translate(42 121)" font-family="Arial,Helvetica,sans-serif">
    <g fill="#151f26" stroke="#34434e"><rect width="245" height="40" rx="7"/><rect y="57" width="245" height="40" rx="7"/><rect y="114" width="245" height="40" rx="7"/></g>
    <g font-family="ui-monospace,Consolas,monospace" font-size="13"><text x="18" y="25" fill="#d2d9de">GET /api/users</text><text x="18" y="82" fill="#d2d9de">query { users }</text><text x="18" y="139" fill="#d2d9de">GetUsersRequest</text></g>
    <path d="M245 20l350 57M245 77h350M245 134l350-57" stroke="#42515c" stroke-width="2" stroke-dasharray="5 7"/>
    <g transform="translate(470)">
      <rect class="core" width="250" height="154" rx="10" fill="#151f26" stroke="#3ad6c6"/>
      <text x="22" y="31" fill="#3ad6c6" font-family="ui-monospace,Consolas,monospace" font-size="11" letter-spacing="1.3">SHARED DOMAIN</text>
      <text x="22" y="66" fill="#f4f0e6" font-size="21" font-weight="700">User operations</text>
      <path d="M22 84h206" stroke="#34434e"/>
      <text x="22" y="111" fill="#99a6af" font-size="14">create · read · update</text>
      <text x="22" y="135" fill="#99a6af" font-size="14">delete · hello · info</text>
    </g>
    <path d="M720 77h235" stroke="#42515c" stroke-width="2" stroke-dasharray="5 7"/>
    <g transform="translate(955)"><rect width="161" height="154" rx="10" fill="#151f26" stroke="#34434e"/><text x="20" y="31" fill="#ffb347" font-family="ui-monospace,Consolas,monospace" font-size="11" letter-spacing="1.3">COMPARE</text><text x="20" y="66" fill="#f4f0e6" font-size="18" font-weight="700">Same result</text><text x="20" y="96" fill="#99a6af" font-size="13">different shape</text><text x="20" y="121" fill="#99a6af" font-size="13">visible trade-offs</text></g>
    <circle class="rest" cx="245" cy="20" r="5" fill="#3ad6c6"/><circle class="gql" cx="245" cy="77" r="5" fill="#ffb347"/><circle class="soap" cx="245" cy="134" r="5" fill="#3ad6c6"/>
  </g>
</svg>
