<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="title desc">
  <title id="title">Noxius Studium private workshop</title>
  <desc id="desc">Animated panels representing the Noxius desktop launcher, Hermes plugins, and defensive software research.</desc>
  <style>
    .cursor{animation:cursor 1.1s steps(1) infinite}.bars rect{transform-origin:bottom;animation:bars 1.5s ease-in-out infinite}.bars rect:nth-child(2){animation-delay:.15s}.bars rect:nth-child(3){animation-delay:.3s}.bars rect:nth-child(4){animation-delay:.45s}.ring{transform-origin:944px 190px;animation:spin 12s linear infinite}.trace{animation:trace 5s linear infinite}.scan{animation:scan 4s ease-in-out infinite}.led{animation:led 2s ease-in-out infinite}
    @keyframes cursor{50%{opacity:0}}@keyframes bars{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes trace{to{stroke-dashoffset:-760}}@keyframes scan{0%,100%{transform:translateY(0)}50%{transform:translateY(112px)}}@keyframes led{0%,100%{opacity:1}50%{opacity:.2}}
    @media(prefers-reduced-motion:reduce){.cursor,.bars rect,.ring,.trace,.scan,.led{animation:none}}
  </style>
  <defs><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1200" height="340" rx="12" fill="#10171d"/>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" letter-spacing="1.6">
    <text x="42" y="43" fill="#ffb347" font-size="12">PRIVATE WORKSHOP / 04</text>
    <text x="1158" y="43" fill="#70808b" font-size="12" text-anchor="end">DESKTOP · AGENTS · RESEARCH</text>
  </g>
  <text x="42" y="85" fill="#f4f0e6" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">Products, extensions, and experiments — before the seams are hidden.</text>
  <g transform="translate(42 116)" font-family="Arial,Helvetica,sans-serif">
    <g>
      <rect width="340" height="174" rx="10" fill="#151f26" stroke="#34434e"/>
      <circle cx="22" cy="20" r="4" fill="#ffb347"/><text x="38" y="24" fill="#9aa7b0" font-family="ui-monospace,Consolas,monospace" font-size="11" letter-spacing="1.2">NOXIUS / DESKTOP</text>
      <rect x="20" y="47" width="300" height="45" rx="7" fill="#0f161b" stroke="#3ad6c6"/>
      <text x="37" y="75" fill="#f4f0e6" font-family="ui-monospace,Consolas,monospace" font-size="14">&gt; launch wsl ubuntu</text><rect class="cursor" x="207" y="62" width="8" height="17" fill="#3ad6c6"/>
      <g transform="translate(20 111)" font-family="ui-monospace,Consolas,monospace" font-size="11"><rect width="90" height="38" rx="6" fill="#10171d" stroke="#34434e"/><rect x="105" width="90" height="38" rx="6" fill="#10171d" stroke="#34434e"/><rect x="210" width="90" height="38" rx="6" fill="#10171d" stroke="#34434e"/><text x="45" y="24" text-anchor="middle" fill="#aeb8bf">APPS</text><text x="150" y="24" text-anchor="middle" fill="#aeb8bf">WSL</text><text x="255" y="24" text-anchor="middle" fill="#aeb8bf">TOOLS</text></g>
    </g>
    <g transform="translate(388)">
      <rect width="340" height="174" rx="10" fill="#151f26" stroke="#34434e"/>
      <circle class="led" cx="22" cy="20" r="4" fill="#3ad6c6"/><text x="38" y="24" fill="#9aa7b0" font-family="ui-monospace,Consolas,monospace" font-size="11" letter-spacing="1.2">HERMES / PLUGINS</text>
      <text x="20" y="61" fill="#f4f0e6" font-size="19" font-weight="700">Composer + fluid music</text>
      <path class="trace" d="M20 86H318" stroke="#3ad6c6" stroke-width="2" stroke-dasharray="38 260"/>
      <g class="bars" transform="translate(20 112)" fill="#ffb347"><rect width="16" height="34" y="0" rx="3"/><rect x="25" width="16" height="34" y="0" rx="3"/><rect x="50" width="16" height="34" y="0" rx="3"/><rect x="75" width="16" height="34" y="0" rx="3"/></g>
      <g transform="translate(132 105)" font-family="ui-monospace,Consolas,monospace" font-size="11"><rect width="186" height="44" rx="6" fill="#10171d" stroke="#34434e"/><text x="14" y="19" fill="#7d8992">VOICE ROUTE</text><text x="14" y="35" fill="#d2d9de">ready / local</text><circle class="led" cx="164" cy="22" r="5" fill="#3ad6c6"/></g>
    </g>
    <g transform="translate(776)">
      <rect width="340" height="174" rx="10" fill="#151f26" stroke="#34434e"/>
      <circle cx="22" cy="20" r="4" fill="#ffb347"/><text x="38" y="24" fill="#9aa7b0" font-family="ui-monospace,Consolas,monospace" font-size="11" letter-spacing="1.2">MIRAGE / RESEARCH</text>
      <g transform="translate(168 93)">
        <circle r="50" fill="none" stroke="#34434e"/><circle class="ring" r="39" fill="none" stroke="#3ad6c6" stroke-width="2" stroke-dasharray="28 18"/>
        <circle r="22" fill="#10171d" stroke="#ffb347"/><text y="5" text-anchor="middle" fill="#f4f0e6" font-family="ui-monospace,Consolas,monospace" font-size="12">CORE</text>
      </g>
      <path class="scan" d="M68 58H268" stroke="#3ad6c6" stroke-width="1" opacity=".55"/>
      <g font-family="ui-monospace,Consolas,monospace" font-size="10" fill="#82909a"><text x="20" y="66">ATTEST</text><text x="264" y="66">GUARD</text><text x="20" y="145">VERIFY</text><text x="265" y="145">DECOY</text></g>
    </g>
  </g>
  <g transform="translate(42 316)" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" letter-spacing="1.3"><circle class="led" cx="5" cy="-4" r="4" fill="#3ad6c6" filter="url(#glow)"/><text x="18" fill="#71808a">ACTIVE WORK IS PRIVATE UNTIL IT CAN EXPLAIN ITSELF.</text></g>
</svg>
