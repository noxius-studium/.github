<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="title desc">
  <title id="title">South African ID conformance across seven languages</title>
  <desc id="desc">One normative specification and shared vectors feed seven language implementations.</desc>
  <style>
    .sweep{animation:sweep 4.6s ease-in-out infinite}.blink{animation:blink 2s ease-in-out infinite}
    @keyframes sweep{0%,12%{transform:translateX(0)}88%,100%{transform:translateX(885px)}}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
    @media(prefers-reduced-motion:reduce){.sweep,.blink{animation:none}}
  </style>
  <defs><filter id="g" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter></defs>
  <rect width="1200" height="300" rx="12" fill="#10171d"/>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" letter-spacing="1.6">
    <text x="42" y="43" fill="#ffb347" font-size="12">IDENTITY CONFORMANCE / 01</text>
    <text x="1158" y="43" fill="#70808b" font-size="12" text-anchor="end">ONE BEHAVIOR · SEVEN IMPLEMENTATIONS</text>
  </g>
  <text x="42" y="85" fill="#f4f0e6" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">A specification is useful only when every implementation agrees.</text>
  <g transform="translate(42 118)" font-family="Arial,Helvetica,sans-serif">
    <rect width="230" height="72" rx="8" fill="#172129" stroke="#3ad6c6"/>
    <text x="20" y="29" fill="#3ad6c6" font-family="ui-monospace,Consolas,monospace" font-size="11" letter-spacing="1.3">SOURCE / SPEC.md</text>
    <text x="20" y="54" fill="#f4f0e6" font-size="18" font-weight="700">Normative rules</text>
    <path d="M230 36h72" stroke="#53636e" stroke-width="2"/>
    <path d="M294 30l8 6-8 6" fill="none" stroke="#53636e" stroke-width="2"/>
    <g transform="translate(302)">
      <rect width="190" height="72" rx="8" fill="#172129" stroke="#ffb347"/>
      <text x="20" y="29" fill="#ffb347" font-family="ui-monospace,Consolas,monospace" font-size="11" letter-spacing="1.3">PROOF / JSON</text>
      <text x="20" y="54" fill="#f4f0e6" font-size="18" font-weight="700">Shared vectors</text>
    </g>
  </g>
  <path d="M534 154H1134" stroke="#40505b" stroke-width="2" stroke-dasharray="6 8"/>
  <circle class="sweep" cx="534" cy="154" r="5" fill="#3ad6c6"/>
  <circle class="sweep" cx="534" cy="154" r="10" fill="#3ad6c6" opacity=".18" filter="url(#g)"/>
  <g transform="translate(42 216)" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" font-weight="700" text-anchor="middle">
    <g><rect width="132" height="48" rx="7" fill="#151f26" stroke="#34434e"/><text x="66" y="30" fill="#d2d9de">C++</text></g>
    <g transform="translate(147)"><rect width="132" height="48" rx="7" fill="#151f26" stroke="#34434e"/><text x="66" y="30" fill="#d2d9de">C#</text></g>
    <g transform="translate(294)"><rect width="132" height="48" rx="7" fill="#151f26" stroke="#34434e"/><text x="66" y="30" fill="#d2d9de">GO</text></g>
    <g transform="translate(441)"><rect width="132" height="48" rx="7" fill="#151f26" stroke="#34434e"/><text x="66" y="30" fill="#d2d9de">PHP</text></g>
    <g transform="translate(588)"><rect width="132" height="48" rx="7" fill="#151f26" stroke="#34434e"/><text x="66" y="30" fill="#d2d9de">PYTHON</text></g>
    <g transform="translate(735)"><rect width="132" height="48" rx="7" fill="#151f26" stroke="#34434e"/><text x="66" y="30" fill="#d2d9de">RUST</text></g>
    <g transform="translate(882)"><rect width="234" height="48" rx="7" fill="#151f26" stroke="#34434e"/><circle class="blink" cx="24" cy="24" r="4" fill="#3ad6c6"/><text x="128" y="30" fill="#d2d9de">TYPESCRIPT</text></g>
  </g>
</svg>
