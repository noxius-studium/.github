<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 278" width="1000" height="278" role="img" aria-labelledby="title desc">
<title id="title">Private workshop — separate from the published plugins</title>
<desc id="desc">Noxius desktop tooling, identity conformance, the skill library and defensive research remain private. FluidMusic and Enchanted Composer are now public and are featured separately.</desc>
<style>.flow{stroke-dasharray:12 16;animation:flow 5s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.wave{transform-box:fill-box;transform-origin:center;animation:wave 1.8s ease-in-out infinite alternate}.wave:nth-child(3n){animation-delay:-.6s}.wave:nth-child(3n + 1){animation-delay:-1.2s}@keyframes flow{to{stroke-dashoffset:-140}}@keyframes pulse{50%{opacity:.4}}@keyframes wave{to{transform:scaleY(.35)}}@media(prefers-reduced-motion:reduce){.flow,.pulse,.wave{animation:none}}</style>
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
<path d="M32 0H0V32" fill="none" stroke="#26333b" stroke-opacity=".35"/>
</pattern>
</defs>
<rect width="1000" height="278" rx="12" fill="#0b1218"/>
<rect x="1" y="1" width="998" height="276" rx="12" fill="url(#grid)" stroke="#2c3b43"/>
<text x="36" y="38" font-family="Consolas,monospace" font-size="14" font-weight="400" fill="#ffb347" letter-spacing="1.2">PRIVATE WORKSHOP</text>
<text x="666" y="38" font-family="Consolas,monospace" font-size="14" font-weight="400" fill="#aab8be" letter-spacing="1.2">NOT PUBLIC RELEASES</text>
<text x="36" y="84" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#f4f0e6" >Still on the bench.</text>
<text x="36" y="123" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#aab8be" >Desktop tooling, identity conformance, skills, and defensive research.</text>
<path d="M36 165H962" fill="none" stroke="#3ad6c6" stroke-width="2" class="flow"/>
<circle cx="41" cy="165" r="5" fill="#ffb347"/>
<text x="36" y="198" font-family="Consolas,monospace" font-size="16" font-weight="400" fill="#aab8be" letter-spacing="1.2">NOXIUS</text>
<circle cx="280" cy="165" r="5" fill="#ffb347"/>
<text x="275" y="198" font-family="Consolas,monospace" font-size="16" font-weight="400" fill="#aab8be" letter-spacing="1.2">IDENTITY</text>
<circle cx="519" cy="165" r="5" fill="#ffb347"/>
<text x="514" y="198" font-family="Consolas,monospace" font-size="16" font-weight="400" fill="#aab8be" letter-spacing="1.2">SKILLS</text>
<circle cx="758" cy="165" r="5" fill="#ffb347"/>
<text x="753" y="198" font-family="Consolas,monospace" font-size="16" font-weight="400" fill="#aab8be" letter-spacing="1.2">RESEARCH</text>
<text x="36" y="245" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#aab8be" >Published projects live above. Private work is not a release promise.</text>
</svg>
